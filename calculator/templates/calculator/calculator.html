<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page_title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px auto;
            max-width: 700px;
            line-height: 1.6;
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 24px;
            background: #fafafa;
        }
        .errorlist {
            color: #b00020;
            list-style: none;
            padding: 0;
            margin: 8px 0;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }
        button {
            background: #43a047;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 12px;
        }
        .nav {
            margin-top: 18px;
        }
        .nav a {
            margin-right: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>{{ page_title }}</h1>

        {% if description %}
            <p>{{ description }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}

            <div>
                {{ form.numbers.label_tag }}
                {{ form.numbers }}
                {% if form.numbers.errors %}
                    <ul class="errorlist">
                        {% for error in form.numbers.errors %}
                            <li>{{ error }}</li>
                        {% endfor %}
                    </ul>
                {% endif %}
            </div>

            <button type="submit">Calculate</button>
        </form>

        <div class="nav">
            <a href="{% url 'home' %}">Back to Home</a>
        </div>
    </div>
</body>
</html>
